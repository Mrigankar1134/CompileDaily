name: Generate signing keystore (one-time)

# Run this ONCE to create the app signing key, then add its output as the
# KEYSTORE_BASE64 secret. Every later build must use that same key: Android
# refuses to update an installed app whose signature changed, so losing this
# key means uninstall-and-reinstall for every user from then on.
#
# Prerequisite: set the KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets
# first. The passwords are read from secrets rather than workflow inputs so
# they are not recorded in the run's UI.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm creating a new signing key'
        required: true

jobs:
  keystore:
    if: ${{ inputs.confirm == 'generate' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets before running this."
            exit 1
          fi
          keytool -genkeypair \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Compile Daily, O=Compile Daily, C=IN"
          base64 -w0 release.keystore > keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.base64.txt
          retention-days: 1

      - name: Next steps
        run: |
          {
            echo "### Signing key created"
            echo ""
            echo "1. Download the \`keystore-base64\` artifact from this run."
            echo "2. Copy the contents of \`keystore.base64.txt\` into a new repository secret named \`KEYSTORE_BASE64\`."
            echo "3. Delete the artifact from this run — it contains the private signing key."
            echo "4. Keep an offline copy of that text somewhere safe. If you lose it you cannot ship updates to already-installed copies."
          } >> "$GITHUB_STEP_SUMMARY"
